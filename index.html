<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#101722" />
<title>MACHINECRAFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" />
<style>
/* Workshop blueprint: slate panels, amber signal colour, cyan drafting lines. */
:root {
  --ink: #0e141d; --panel: rgba(16, 23, 34, 0.88); --panel2: rgba(30, 41, 58, 0.92); --line: rgba(126, 200, 227, 0.28);
  --fg: #e9eef5; --dim: #9fb0c3; --amber: #ffb547; --cyan: #7ee0ff; --bad: #ff6a5a; --good: #6fe08a;
  --display: 'Chakra Petch', 'Trebuchet MS', system-ui, sans-serif; --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #101722; color: var(--fg); font: 500 14px/1.35 var(--body); touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
.cut { clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.card { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.h { font-family: var(--display); letter-spacing: 0.06em; text-transform: uppercase; }

#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#cross { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; pointer-events: none !important; opacity: 0.9; }
#cross::before, #cross::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
#cross::before { left: 8px; top: 2px; width: 2px; height: 14px; } #cross::after { top: 8px; left: 2px; height: 2px; width: 14px; }
#target { position: absolute; left: 50%; top: calc(50% + 26px); transform: translateX(-50%); text-align: center; pointer-events: none !important; text-shadow: 0 1px 3px rgba(0,0,0,.8); white-space: nowrap; }
#target b { font-family: var(--display); font-size: 14px; letter-spacing: .04em; }
#target small { display: block; color: #dfe8f2; font-size: 12px; opacity: .9; }
#mine { width: 90px; height: 5px; margin: 5px auto 0; background: rgba(0,0,0,.45); border-radius: 3px; overflow: hidden; }
#mine i { display: block; height: 100%; width: 0; background: var(--amber); }

#quest { position: absolute; left: calc(10px + var(--sal)); top: calc(10px + var(--sat)); width: min(300px, 62vw); padding: 10px 12px 11px; }
#quest .tag { font-size: 10.5px; color: var(--amber); }
#quest h3 { margin: 1px 0 3px; font: 600 16px/1.15 var(--display); }
#quest p { margin: 0 0 7px; color: var(--dim); font-size: 12.5px; }
#quest.min p, #quest.min .goal { display: none; }
.goal { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.goal .bar { grid-column: 1 / -1; height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
.goal .bar i { display: block; height: 100%; background: var(--cyan); transition: width .3s; }
.goal.done .bar i { background: var(--good); }

#top { position: absolute; right: calc(10px + var(--sar)); top: calc(10px + var(--sat)); display: flex; gap: 6px; align-items: stretch; }
#top .pill { padding: 6px 10px; font-size: 12px; display: flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; }
#top button.pill { font-family: var(--display); letter-spacing: .08em; font-weight: 600; }
#top button.pill:hover { border-color: var(--amber); color: var(--amber); }
#sun { width: 14px; height: 14px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 8px var(--amber); }
#chan { position: absolute; right: calc(10px + var(--sar)); top: calc(52px + var(--sat)); display: flex; gap: 6px; padding: 6px 8px; align-items: center; }
#chan span { font-size: 10px; color: var(--dim); font-family: var(--display); letter-spacing: .08em; }
.lamp { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--c); background: rgba(0,0,0,.35); position: relative; }
.lamp.on { background: var(--c); box-shadow: 0 0 12px var(--c); }
.lamp.latch::after { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: #fff; opacity: .85; }
#power { position: absolute; right: calc(10px + var(--sar)); top: calc(98px + var(--sat)); padding: 6px 10px; font-size: 12px; min-width: 150px; font-variant-numeric: tabular-nums; }
#power .bar { height: 5px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; margin-top: 4px; }
#power .bar i { display: block; height: 100%; background: var(--good); }
#power.low .bar i { background: var(--bad); }

#hotbar { position: absolute; left: 50%; bottom: calc(10px + var(--sab)); transform: translateX(-50%); display: flex; gap: 5px; padding: 6px; max-width: calc(100vw - 12px); }
.slot { width: 52px; height: 52px; position: relative; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14); border-radius: 4px; flex: 0 1 52px; min-width: 0; }
.slot img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.slot.sel { border-color: var(--amber); box-shadow: 0 0 0 2px var(--amber), 0 0 14px rgba(255,181,71,.5); background: rgba(255,181,71,.12); }
.slot .n { position: absolute; right: 3px; bottom: 1px; font-size: 11px; font-weight: 600; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.slot .k { position: absolute; left: 3px; top: 1px; font-size: 9.5px; color: var(--dim); }
.slot.lack img { filter: grayscale(1) brightness(.6); }
#selname { position: absolute; left: 50%; bottom: calc(80px + var(--sab)); transform: translateX(-50%); font-family: var(--display); font-size: 13px; letter-spacing: .06em; text-shadow: 0 1px 3px #000; pointer-events: none !important; white-space: nowrap; transition: opacity .4s; }

#toasts { position: absolute; left: 50%; top: calc(64px + var(--sat)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none !important; width: min(92vw, 460px); }
.toast { padding: 8px 14px; background: var(--panel2); border-left: 3px solid var(--cyan); font-size: 13px; animation: tin .25s ease-out; text-align: center; }
.toast.warn { border-color: var(--bad); } .toast.good { border-color: var(--good); } .toast.big { font-family: var(--display); font-size: 16px; border-color: var(--amber); padding: 12px 18px; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
.wp { position: absolute; left: 0; top: 0; pointer-events: none !important; font: 600 11px var(--display); letter-spacing: .05em; text-align: center; text-shadow: 0 1px 3px #000; transform: translate(-50%, -50%); white-space: nowrap; }
.wp i { display: block; width: 10px; height: 10px; margin: 0 auto 2px; transform: rotate(45deg); background: var(--c, #fff); box-shadow: 0 0 8px var(--c, #fff); }

/* touch controls */
#stick { position: absolute; width: 124px; height: 124px; margin: -62px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); background: rgba(10,16,24,.25); opacity: 0; pointer-events: none !important; transition: opacity .15s; }
#stick.on { opacity: 1; } #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.55); transform: translate(-50%, -50%); }
#tbtns { position: absolute; right: calc(8px + var(--sar)); bottom: calc(84px + var(--sab)); display: grid; grid-template-columns: repeat(3, 58px); gap: 8px; }
.tb { width: 58px; height: 58px; border-radius: 50%; background: rgba(14,20,29,.55); border: 1.5px solid rgba(255,255,255,.35); font: 600 11px var(--display); letter-spacing: .06em; color: #fff; }
.tb:active, .tb.held { background: rgba(255,181,71,.5); border-color: var(--amber); }
.tb.big { border-color: var(--amber); }
body:not(.touch) #tbtns { display: none; }
body.touch #target small { font-size: 11px; }
body.seated #cross, body.seated #hotbar, body.seated #selname { display: none; }
#drivehint { position: absolute; left: 50%; bottom: calc(16px + var(--sab)); transform: translateX(-50%); padding: 7px 14px; font-size: 12.5px; white-space: nowrap; }
body:not(.seated) #drivehint { display: none; }

/* panels */
.modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(6,10,16,.45); padding: calc(10px + var(--sat)) calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal)); }
.panel { width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.panel header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
.panel header h2 { margin: 0; font: 700 18px var(--display); letter-spacing: .08em; text-transform: uppercase; flex: 1; }
.x { width: 34px; height: 34px; border: 1px solid var(--line); font-size: 18px; line-height: 1; }
.x:hover { border-color: var(--bad); color: var(--bad); }
.tabs { display: flex; gap: 4px; }
.tab { padding: 7px 12px; font: 600 12.5px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); border-bottom: 2px solid transparent; }
.tab.on { color: var(--amber); border-color: var(--amber); }
.body { padding: 12px 14px; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.pc { position: relative; padding: 6px 6px 8px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pc:hover, .pc.on { border-color: var(--amber); background: rgba(255,181,71,.08); }
.pc img { width: 60px; height: 60px; }
.pc b { font: 600 12.5px var(--display); letter-spacing: .03em; }
.cost { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; font-size: 10.5px; color: var(--dim); }
.cost span { padding: 0 4px; background: rgba(255,255,255,.07); border-radius: 2px; white-space: nowrap; }
.cost span.no { color: var(--bad); }
.pc.locked { opacity: .45; } .pc.locked::after { content: 'LOCKED'; position: absolute; top: 26px; left: 50%; transform: translateX(-50%) rotate(-8deg); font: 700 11px var(--display); letter-spacing: .1em; color: var(--amber); border: 1px solid var(--amber); padding: 1px 6px; background: var(--ink); }
#desc { margin-top: 10px; min-height: 38px; padding: 8px 10px; border-left: 3px solid var(--cyan); background: rgba(126,224,255,.06); font-size: 13px; color: #d5e2ee; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.row > label { width: 78px; color: var(--dim); font-size: 12px; font-family: var(--display); letter-spacing: .06em; text-transform: uppercase; }
.btn { padding: 8px 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); font: 600 12.5px var(--display); letter-spacing: .05em; }
.btn:hover { border-color: var(--amber); } .btn.on { background: var(--amber); color: #1a1408; border-color: var(--amber); }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.primary { background: var(--amber); color: #1a1408; border-color: var(--amber); font-size: 15px; padding: 12px 18px; }
.btn.primary:hover { filter: brightness(1.1); }
.dot { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--c); background: transparent; }
.dot.on { background: var(--c); box-shadow: 0 0 12px var(--c); }
input[type=range] { flex: 1; min-width: 120px; accent-color: var(--amber); height: 28px; }
.val { min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.ir { display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
.ir img { width: 34px; height: 34px; } .ir b { flex: 1; font-weight: 500; font-size: 12.5px; } .ir .n { font-variant-numeric: tabular-nums; font-weight: 600; }
.ir .mini { padding: 3px 6px; font-size: 10.5px; border: 1px solid var(--line); font-family: var(--display); }
.ir .mini:hover { border-color: var(--amber); }
.live { padding: 8px 10px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.08); font-size: 13px; font-variant-numeric: tabular-nums; }
.help { columns: 2 240px; gap: 22px; font-size: 13px; color: #d5e2ee; }
.help h4 { margin: 0 0 4px; font: 600 13px var(--display); color: var(--amber); letter-spacing: .06em; text-transform: uppercase; }
.help p { margin: 0 0 10px; break-inside: avoid; }
kbd { font: 600 11px var(--display); padding: 1px 5px; border: 1px solid var(--line); border-radius: 3px; background: rgba(255,255,255,.06); }

/* title */
#menu { background: linear-gradient(180deg, rgba(8,13,22,.25), rgba(8,13,22,.7)); flex-direction: column; gap: 18px; text-align: center; }
#logo { font: 700 clamp(34px, 9vw, 84px)/0.95 var(--display); letter-spacing: .04em; color: #fff; text-shadow: 0 3px 0 #b36b12, 0 6px 22px rgba(0,0,0,.55); }
#logo span { color: var(--amber); }
#tagline { font: 500 clamp(13px, 2.6vw, 18px) var(--display); letter-spacing: .28em; text-transform: uppercase; color: #dbe8f5; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
#mbtns { display: flex; flex-direction: column; gap: 9px; width: min(320px, 86vw); }
#mbtns .btn { padding: 12px; font-size: 14px; background: var(--panel); }
#mbtns .btn.primary { background: var(--amber); }
#mnote { font-size: 12px; color: #c9d6e4; max-width: 520px; text-shadow: 0 1px 4px rgba(0,0,0,.8); padding: 0 12px; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #101722; font: 600 15px var(--display); letter-spacing: .2em; color: var(--amber); z-index: 50; }
@media (max-width: 640px) {
  .slot { height: 44px; flex-basis: 44px; } #hotbar { gap: 3px; padding: 4px; }
  #quest { width: min(230px, 56vw); padding: 7px 9px; } #quest h3 { font-size: 13.5px; } #quest p { font-size: 11.5px; }
  #top .pill.wide { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); } .pc img { width: 48px; height: 48px; }
}
@media (max-height: 460px) {
  #tbtns { grid-template-columns: repeat(3, 50px); gap: 6px; bottom: calc(64px + var(--sab)); } .tb { width: 50px; height: 50px; font-size: 10px; }
  #quest p { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="loading">WARMING UP THE BOILERS…</div>

<div id="hud" hidden>
  <div id="cross"></div>
  <div id="target"><b></b><small></small><div id="mine" hidden><i></i></div></div>
  <div id="quest" class="card cut"><div class="tag h"></div><h3></h3><p></p><div id="goals"></div></div>
  <div id="top">
    <div class="pill card wide"><i id="sun"></i><span id="clock">06:00</span></div>
    <button class="pill card" id="bParts">PARTS</button>
    <button class="pill card" id="bMenu">MENU</button>
  </div>
  <div id="chan" class="card"><span>CH</span></div>
  <div id="power" class="card" hidden><div id="ptext"></div><div class="bar"><i></i></div></div>
  <div id="toasts"></div>
  <div id="selname" class="h"></div>
  <div id="hotbar" class="card"></div>
  <div id="drivehint" class="card"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="tbtns">
    <button class="tb" data-a="rotate">TURN</button><button class="tb" data-a="config">SET</button><button class="tb" data-a="use">USE</button>
    <button class="tb" data-h="down" id="tDown">DOWN</button><button class="tb big" data-a="place">PLACE</button><button class="tb big" data-h="break">DIG</button>
    <button class="tb" data-a="anchor">LOCK</button><button class="tb" data-a="fly" id="tFly">FLY</button><button class="tb" data-h="jump">JUMP</button>
  </div>
  <div id="wps"></div>
</div>

<div id="catalog" class="modal" hidden>
  <div class="panel cut">
    <header><h2>Workshop</h2><div class="tabs"><button class="tab on" data-t="parts">Parts</button><button class="tab" data-t="mats">Materials</button><button class="tab" data-t="help">Guide</button></div><button class="x" data-close>×</button></header>
    <div class="body"><div id="catBody"></div><div id="desc">Pick a part to put it in the highlighted hotbar slot.</div></div>
  </div>
</div>

<div id="partPanel" class="modal" hidden>
  <div class="panel cut" style="width:min(460px,100%)">
    <header><h2 id="ppTitle"></h2><button class="x" data-close>×</button></header>
    <div class="body" id="ppBody"></div>
  </div>
</div>

<div id="menu" class="modal" hidden>
  <div><div id="logo">MACHINE<span>CRAFT</span></div><div id="tagline">Build anything that actually works</div></div>
  <div id="mbtns"></div>
  <div id="mnote"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
